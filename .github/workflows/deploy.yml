name: Deploy to AWS

on:
  push:
    branches: [main]

env:
  AWS_REGION:   us-east-2
  APP_NAME:     ed-triage
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-2.amazonaws.com
  BACKEND_REPO: ed-triage-backend
  ECS_CLUSTER:  ed-triage-cluster
  ECS_SERVICE:  ed-triage-backend

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            us-east-2

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if missing
        run: |
          aws ecr describe-repositories --repository-names $BACKEND_REPO 2>/dev/null || \
          aws ecr create-repository --repository-name $BACKEND_REPO

      - name: Build and push backend image
        run: |
          IMAGE=$ECR_REGISTRY/$BACKEND_REPO:${{ github.sha }}
          docker build -t $IMAGE -t $ECR_REGISTRY/$BACKEND_REPO:latest ./backend
          docker push $IMAGE
          docker push $ECR_REGISTRY/$BACKEND_REPO:latest

      - name: Render ECS task definition
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          LANGFUSE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
        run: |
          SECRET_ARN="arn:aws:secretsmanager:$AWS_REGION:$ACCOUNT_ID:secret:$APP_NAME/prod"
          IMAGE="$ECR_REGISTRY/$BACKEND_REPO:${{ github.sha }}"
          jq -n \
            --arg image    "$IMAGE" \
            --arg family   "$APP_NAME-backend" \
            --arg execRole "arn:aws:iam::$ACCOUNT_ID:role/$APP_NAME-ecs-execution-role" \
            --arg taskRole "arn:aws:iam::$ACCOUNT_ID:role/$APP_NAME-ecs-task-role" \
            --arg region   "$AWS_REGION" \
            --arg logGroup "/ecs/$APP_NAME-backend" \
            --arg lf_url   "$LANGFUSE_URL" \
            --arg sec_anthropic "$SECRET_ARN:ANTHROPIC_API_KEY::" \
            --arg sec_db       "$SECRET_ARN:DATABASE_URL::" \
            --arg sec_key      "$SECRET_ARN:SECRET_KEY::" \
            --arg sec_lf_pub   "$SECRET_ARN:LANGFUSE_PUBLIC_KEY::" \
            --arg sec_lf_sec   "$SECRET_ARN:LANGFUSE_SECRET_KEY::" \
            '{
              family: $family,
              networkMode: "awsvpc",
              requiresCompatibilities: ["FARGATE"],
              cpu: "512",
              memory: "1024",
              executionRoleArn: $execRole,
              taskRoleArn: $taskRole,
              containerDefinitions: [{
                name: ($family),
                image: $image,
                essential: true,
                portMappings: [{ containerPort: 8000, protocol: "tcp" }],
                environment: [
                  { name: "ENVIRONMENT",      value: "production" },
                  { name: "LANGFUSE_BASE_URL", value: $lf_url },
                  { name: "LANGFUSE_HOST",     value: $lf_url }
                ],
                secrets: [
                  { name: "ANTHROPIC_API_KEY",  valueFrom: $sec_anthropic },
                  { name: "DATABASE_URL",        valueFrom: $sec_db },
                  { name: "SECRET_KEY",          valueFrom: $sec_key },
                  { name: "LANGFUSE_PUBLIC_KEY", valueFrom: $sec_lf_pub },
                  { name: "LANGFUSE_SECRET_KEY", valueFrom: $sec_lf_sec }
                ],
                logConfiguration: {
                  logDriver: "awslogs",
                  options: {
                    "awslogs-group":         $logGroup,
                    "awslogs-region":        $region,
                    "awslogs-stream-prefix": "ecs"
                  }
                },
                healthCheck: {
                  command:     ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"],
                  interval:    30,
                  timeout:     5,
                  retries:     3,
                  startPeriod: 60
                }
              }]
            }' > /tmp/task-def.json
          echo "Task def rendered: $(wc -c < /tmp/task-def.json) bytes"

      - name: Register task definition
        id: register-task
        run: |
          ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task_def_arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Bootstrap ECS cluster and service if missing
        run: |
          # Ensure ECS service-linked role exists (one-time per account)
          aws iam create-service-linked-role --aws-service-name ecs.amazonaws.com 2>/dev/null || true

          # Create cluster if it doesn't exist
          aws ecs describe-clusters --clusters $ECS_CLUSTER \
            --query 'clusters[?status==`ACTIVE`].clusterName' \
            --output text | grep -q $ECS_CLUSTER || \
          aws ecs create-cluster --cluster-name $ECS_CLUSTER

          # Check if service exists
          SERVICE_COUNT=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER --services $ECS_SERVICE \
            --query 'length(services[?status==`ACTIVE`])' \
            --output text)

          if [ "$SERVICE_COUNT" = "0" ] || [ -z "$SERVICE_COUNT" ]; then
            # Get default VPC subnets and create a security group
            VPC_ID=$(aws ec2 describe-vpcs \
              --filters Name=isDefault,Values=true \
              --query 'Vpcs[0].VpcId' --output text)

            SUBNETS=$(aws ec2 describe-subnets \
              --filters Name=vpc-id,Values=$VPC_ID \
              --query 'Subnets[*].SubnetId' \
              --output text | tr '\t' ',')

            SG_ID=$(aws ec2 describe-security-groups \
              --filters Name=group-name,Values=ed-triage-ecs Name=vpc-id,Values=$VPC_ID \
              --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null)

            if [ "$SG_ID" = "None" ] || [ -z "$SG_ID" ]; then
              SG_ID=$(aws ec2 create-security-group \
                --group-name ed-triage-ecs \
                --description "ED Triage ECS tasks" \
                --vpc-id $VPC_ID \
                --query 'GroupId' --output text)
              aws ec2 authorize-security-group-ingress \
                --group-id $SG_ID \
                --protocol tcp --port 8000 --cidr 0.0.0.0/0
            fi

            aws ecs create-service \
              --cluster $ECS_CLUSTER \
              --service-name $ECS_SERVICE \
              --task-definition ${{ steps.register-task.outputs.task_def_arn }} \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG_ID],assignPublicIp=ENABLED}"
          fi

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition ${{ steps.register-task.outputs.task_def_arn }} \
            --force-new-deployment
          echo "Deployment triggered. ECS will roll out in the background."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Sync frontend to S3
        env:
          BUCKET: ${{ secrets.S3_BUCKET_FRONTEND }}
          CF_DIST: ${{ secrets.CLOUDFRONT_DIST_ID }}
        run: |
          aws s3 sync frontend/dist/ "s3://${BUCKET}/" --delete --exclude "index.html" --cache-control "max-age=31536000,immutable"
          aws s3 cp frontend/dist/index.html "s3://${BUCKET}/index.html" --cache-control "no-cache,no-store,must-revalidate"
          aws cloudfront create-invalidation --distribution-id "$CF_DIST" --paths "/*"
