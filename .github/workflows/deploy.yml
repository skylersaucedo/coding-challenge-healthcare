name: Deploy to AWS

on:
  push:
    branches: [main]

env:
  AWS_REGION:    us-east-2
  ECR_REGISTRY:  ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-2.amazonaws.com
  BACKEND_REPO:  ed-triage-backend
  ECS_CLUSTER:   ed-triage-cluster
  ECS_SERVICE:   ed-triage-backend

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            us-east-2

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if missing
        run: |
          aws ecr describe-repositories --repository-names $BACKEND_REPO --region $AWS_REGION 2>/dev/null || \
          aws ecr create-repository --repository-name $BACKEND_REPO --region $AWS_REGION

      - name: Build and push backend image
        id: build-backend
        run: |
          IMAGE=$ECR_REGISTRY/$BACKEND_REPO:${{ github.sha }}
          docker build -t $IMAGE -t $ECR_REGISTRY/$BACKEND_REPO:latest ./backend
          docker push $IMAGE
          docker push $ECR_REGISTRY/$BACKEND_REPO:latest
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Render ECS task definition
        run: |
          export ACCOUNT_ID="${{ secrets.AWS_ACCOUNT_ID }}"
          export REGION="$AWS_REGION"
          export LANGFUSE_BASE_URL="${{ secrets.LANGFUSE_BASE_URL }}"
          export IMAGE_TAG="${{ github.sha }}"
          envsubst < scripts/ecs-task-def.json.template \
            | jq --arg img "$ECR_REGISTRY/$BACKEND_REPO:${{ github.sha }}" \
                 '.containerDefinitions[0].image = $img' \
            > /tmp/task-def.json

      - name: Register task definition
        id: register-task
        run: |
          ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task_def_arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster  $ECS_CLUSTER \
            --service  $ECS_SERVICE \
            --task-definition ${{ steps.register-task.outputs.task_def_arn }} \
            --force-new-deployment \
            --region $AWS_REGION
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --region $AWS_REGION

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Sync frontend to S3
        run: |
          aws s3 sync frontend/dist/ s3://${{ secrets.S3_BUCKET_FRONTEND }}/ \
            --delete \
            --exclude "index.html" \
            --cache-control "max-age=31536000,immutable"
          aws s3 cp frontend/dist/index.html \
            s3://${{ secrets.S3_BUCKET_FRONTEND }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} \
            --paths "/*"
