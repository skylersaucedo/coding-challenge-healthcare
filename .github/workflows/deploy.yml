name: Deploy to AWS

on:
  push:
    branches: [main]

env:
  AWS_REGION:   us-east-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-2.amazonaws.com
  BACKEND_REPO: ed-triage-backend
  ECS_CLUSTER:  ed-triage-cluster
  ECS_SERVICE:  ed-triage-backend

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            us-east-2

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if missing
        run: |
          aws ecr describe-repositories --repository-names $BACKEND_REPO 2>/dev/null || \
          aws ecr create-repository --repository-name $BACKEND_REPO

      - name: Build and push backend image
        run: |
          IMAGE=$ECR_REGISTRY/$BACKEND_REPO:${{ github.sha }}
          docker build -t $IMAGE -t $ECR_REGISTRY/$BACKEND_REPO:latest ./backend
          docker push $IMAGE
          docker push $ECR_REGISTRY/$BACKEND_REPO:latest

      - name: Render ECS task definition
        run: |
          export ACCOUNT_ID="${{ secrets.AWS_ACCOUNT_ID }}"
          export REGION="$AWS_REGION"
          export LANGFUSE_BASE_URL="${{ secrets.LANGFUSE_BASE_URL }}"
          export IMAGE_TAG="${{ github.sha }}"
          envsubst < scripts/ecs-task-def.json.template \
            | jq --arg img "$ECR_REGISTRY/$BACKEND_REPO:${{ github.sha }}" \
                 '.containerDefinitions[0].image = $img' \
            > /tmp/task-def.json

      - name: Register task definition
        id: register-task
        run: |
          ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task_def_arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Bootstrap ECS cluster and service if missing
        run: |
          # Ensure ECS service-linked role exists (one-time per account)
          aws iam create-service-linked-role --aws-service-name ecs.amazonaws.com 2>/dev/null || true

          # Create cluster if it doesn't exist
          aws ecs describe-clusters --clusters $ECS_CLUSTER \
            --query 'clusters[?status==`ACTIVE`].clusterName' \
            --output text | grep -q $ECS_CLUSTER || \
          aws ecs create-cluster --cluster-name $ECS_CLUSTER

          # Check if service exists
          SERVICE_COUNT=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER --services $ECS_SERVICE \
            --query 'length(services[?status==`ACTIVE`])' \
            --output text)

          if [ "$SERVICE_COUNT" = "0" ] || [ -z "$SERVICE_COUNT" ]; then
            # Get default VPC subnets and create a security group
            VPC_ID=$(aws ec2 describe-vpcs \
              --filters Name=isDefault,Values=true \
              --query 'Vpcs[0].VpcId' --output text)

            SUBNETS=$(aws ec2 describe-subnets \
              --filters Name=vpc-id,Values=$VPC_ID \
              --query 'Subnets[*].SubnetId' \
              --output text | tr '\t' ',')

            SG_ID=$(aws ec2 describe-security-groups \
              --filters Name=group-name,Values=ed-triage-ecs Name=vpc-id,Values=$VPC_ID \
              --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null)

            if [ "$SG_ID" = "None" ] || [ -z "$SG_ID" ]; then
              SG_ID=$(aws ec2 create-security-group \
                --group-name ed-triage-ecs \
                --description "ED Triage ECS tasks" \
                --vpc-id $VPC_ID \
                --query 'GroupId' --output text)
              aws ec2 authorize-security-group-ingress \
                --group-id $SG_ID \
                --protocol tcp --port 8000 --cidr 0.0.0.0/0
            fi

            aws ecs create-service \
              --cluster $ECS_CLUSTER \
              --service-name $ECS_SERVICE \
              --task-definition ${{ steps.register-task.outputs.task_def_arn }} \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG_ID],assignPublicIp=ENABLED}"
          fi

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition ${{ steps.register-task.outputs.task_def_arn }} \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Sync frontend to S3
        run: |
          aws s3 sync frontend/dist/ s3://${{ secrets.S3_BUCKET_FRONTEND }}/ \
            --delete \
            --exclude "index.html" \
            --cache-control "max-age=31536000,immutable"
          aws s3 cp frontend/dist/index.html \
            s3://${{ secrets.S3_BUCKET_FRONTEND }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} \
            --paths "/*"
